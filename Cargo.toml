[package]
name = "cargo-zirild"
version = "0.2.0"
edition = "2024"
authors = ["SorMaze"]
rust-version = "1.85"
description = "Run Cargo commands using Zig as the C, C++, and final-link toolchain"
readme = "README.md"
license = "BSD-2-Clause"
documentation = "https://docs.rs/cargo-zirild"
homepage = "https://github.com/SorMaze/zirild"
repository = "https://github.com/SorMaze/zirild"
keywords = ["cargo", "zig", "cross-compilation", "cxx"]
categories = ["command-line-utilities", "development-tools::build-utils"]
exclude = [".workbuddy", "examples/mixed"]

[dependencies]

[[bin]]
name = "cargo-zirild"
path = "src/main.rs"
